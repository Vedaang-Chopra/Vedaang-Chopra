  - label: Memory analysis with Volatility 2 and a public YARA rule set
    status: built
  - label: Raw forensic findings converted into a labelled dataset of memory windows
    status: built
  - label: PCA and t-SNE to study the feature space
    status: built
  - label: Nine scikit-learn classifiers compared
    status: built

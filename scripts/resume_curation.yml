projects:
- id: cad
  name: CAD repair without fine-tuning
  credit: Owner, CORE Robotics Lab
  credit_kind: owner
  state: Ongoing
  lenses:
  - research
  - agentic
  order:
    research: 1
    agentic: 1
  problem: 'A language model can write CAD code that runs but builds the wrong part: a flipped rotation, a wrong
    dimension, a missing hole. A score on the final shape says the part is wrong but not which step broke it, so
    blind retries drift.'
  idea: Keep the model frozen and give it a deterministic way to see its own geometry. A new representation records
    the part after every construction step. A process verifier compares each step with the target and blames the
    first one that goes wrong. A repair loop feeds that diagnosis back, and what worked is stored as reusable repair
    cards, the skills, for later runs.
  visual: cad
  mechanism:
  - label: The model writes CadQuery and the code runs in a sandbox
    status: built
  - label: 'Intermediate representation: a feature tree plus the solid after each operation'
    status: partial
    note: Fixes are done, the experiment is pending.
  - label: Outcome check of the final part against the target
    status: built
  - label: 'Process verifier: a verdict for every operation, correct, first error or inherited'
    status: built
    note: Tested on hand-made faults, not yet on real model errors.
  - label: 'Repair packet: what is wrong, where, how to fix it, what to keep'
    status: partial
  - label: Bounded repair loop, up to 3 turns, keeping the best result
    status: built
    note: Currently guided by the ground-truth shape.
  - label: Learn repair cards from labelled training samples
    status: partial
    note: Works offline and in tests.
  - label: Reuse cards in later runs
    status: partial
    note: Not wired into the live loop yet.
  - label: Repair without the ground-truth shape
    status: proposed
    note: One small pilot only.
  unique:
  - The diagnosis is deterministic and per step, not a retry on a final score.
  - Learning lives in an external card store, so the model weights never change.
  - 'Failures are reported: a feedback ablation tied and a pre-registered gate failed.'
  skills:
  - evaluation
  - langgraph
  - pydantic
  - bootstrap
  cards:
  - cad-iou
  - cad-scope
  - cad-abc
  - cad-gate
  lead: null
  links:
  - label: Code
    url: https://github.com/Vedaang-Chopra/CAD-Physics
  summary: A frozen model writes CAD code, and a deterministic verifier tells it which construction step went wrong.
    Ongoing, and repair is still guided by the target shape.
  blurb: ''
- id: cerberus
  name: CERBERUS, a resizable vision-language bridge
  credit: Owner, research project
  credit_kind: owner
  state: Ongoing
  lenses:
  - research
  order:
    research: 2
    agentic: 8
  problem: Most vision-language models turn every image into the same fixed number of visual tokens, whatever the
    question. The language model reads a lot it does not need.
  idea: 'Let the question decide how many image patches reach the language model. The foundation is built: frozen
    image and text encoders aligned in one shared space that can be shrunk. The question-aware selector is the next
    step. It is a proposal, not built.'
  visual: cerberus
  mechanism:
  - label: Frozen CLIP image encoder and sentence text encoder
    status: built
  - label: Learned attention pooling into one shared 4096-dimension space
    status: built
  - label: Matryoshka nested sizes from 4096 down to 128 dimensions
    status: built
    note: Shrinks the vector, not the number of patches.
  - label: Contrastive alignment on PixMo image-caption pairs
    status: built
  - label: Perceiver compression of image tokens
    status: negative
    note: Retrieval stayed near random.
  - label: Qwen decoder with LoRA reading the aligned tokens
    status: partial
    note: One 7B run, training loss only, no held-out answer metric yet.
  - label: Question-conditioned choice of how many patches to keep
    status: proposed
  unique:
  - 'Honest about what is a proposal: question-aware selection is framed as a research question with named failure
    modes.'
  - 'A negative result is kept: Perceiver compression failed.'
  skills:
  - pytorch
  - clip-sbert
  - matryoshka
  - lora
  - retrieval
  cards:
  - cerberus-r5
  lead: null
  links:
  - label: Code
    url: https://github.com/Vedaang-Chopra/CEREBRUS
  summary: A resizable image-to-language bridge is built. A question-aware patch selector, where the question decides
    how much of the image the model reads, is proposed.
  blurb: ''
- id: artemis
  name: ARTEMIS, routing to the right model
  credit: Owner, research project
  credit_kind: owner
  state: Ongoing
  lenses:
  - research
  - agentic
  order:
    research: 3
    agentic: 3
  problem: Several vision-language models can answer a request, but they differ widely in price and speed. Always
    calling the biggest one wastes money. Picking wrongly loses accuracy.
  idea: Build a leakage-free benchmark of which model is good at which kind of task, then learn to send each request
    to the cheapest model likely to be right. Smaller, quantized models win on some task types, so the strongest
    model is not always needed.
  visual: artemis
  mechanism:
  - label: Collect answers from five models on 67,711 questions
    status: built
  - label: Split by image so no picture appears in both train and test
    status: built
    note: Found and removed 3,909 shared images that had inflated earlier numbers.
  - label: Cost and latency model per call
    status: built
  - label: 'Baselines: best single model, per-task lookup, oracle'
    status: built
  - label: Learned router with cost and latency penalties set at decision time
    status: built
    note: Did not beat the per-task lookup on the test split.
  - label: Serving layer and verifier cascade
    status: partial
    note: Code only, never validated on live backends.
  unique:
  - The benchmark was corrected after a leak was found, and the old numbers were retired.
  - Cost penalties are applied at decision time, so one model serves cheap, fast and accurate modes.
  skills:
  - evaluation
  - routing
  - bootstrap
  cards:
  - artemis-router
  lead: null
  links:
  - label: Code
    url: https://github.com/Vedaang-Chopra/ARTEMIS
  summary: A leakage-free benchmark and a router that sends requests to cheaper vision-language models. The learned
    router has not yet beaten a simple lookup.
  blurb: ''
- id: athena
  name: ATHENA, from idea to storyboard
  credit: Team project, Georgia Tech
  credit_kind: team
  state: Built, being hardened
  lenses:
  - agentic
  order:
    research: 9
    agentic: 2
  problem: Turning a vague creative idea into an editable storyboard takes several disconnected tools. A naive pipeline
    redoes everything when one scene changes, or loses the work when a long run dies.
  idea: One typed project object flows through a LangGraph. A language model reads the brief once and writes an
    execution plan. After that, routing is plain code with no model supervisor. Every step checks whether its output
    already exists and is valid, so runs resume and an edit regenerates only what it affects.
  visual: athena
  mechanism:
  - label: Eight LangGraph nodes from intent to project assembly
    status: built
  - label: Per-scene research, script, visual direction and shots run in a loop with failure isolation
    status: built
  - label: 'Five research tools exposed as an MCP server: web, page, image, YouTube search and transcripts'
    status: built
  - label: Resume and selective regeneration from the first invalid artifact
    status: built
  - label: Image generation with a fallback model
    status: partial
    note: A fix for silent empty images is not yet re-verified end to end.
  - label: Scene evaluator
    status: partial
    note: Text only.
  - label: Video generation from the storyboard
    status: proposed
  unique:
  - Deterministic routing driven by an execution plan, replacing an earlier model-supervisor prototype.
  - Resume and regeneration are properties of the data model, not extra code.
  - The research tools are a reusable MCP server.
  skills:
  - langgraph
  - pydantic
  - multi-agent
  - tool-calling
  cards: []
  lead: null
  links: []
  summary: An idea becomes an editable storyboard through a graph that resumes and regenerates only what changed.
  blurb: ''
- id: shastra
  name: SHASTRA, learning from agent traces
  credit: Team project, CS 8903, advisor Dr. Alexey Tumanov
  credit_kind: team
  state: Research prototype
  lenses:
  - agentic
  order:
    research: 9
    agentic: 4
  problem: Agent benchmark traces are long and messy, and every agent solves a task its own way. There is no common
    representation for asking whether solution steps repeat across tasks, so that a stored module could have served
    them.
  idea: 'Measure before building: turn each trace into comparable structure, then check whether that structure recurs.
    The longer-term goal is parameterized deterministic workflows as procedural memory for agents. That goal is
    not built.'
  visual: shastra
  mechanism:
  - label: Ingest traces from several agent benchmarks
    status: built
  - label: Group events into blocks
    status: built
  - label: An LLM labels each block with capabilities, checked by code, in an append-only label registry
    status: built
    note: Label quality is not validated.
  - label: Build a task-dependency graph from the trace
    status: built
  - label: Reverse decomposition into subtasks
    status: negative
    note: 0 of 11 passed validation.
  - label: Replay a graph as compiled LangGraph code
    status: partial
    note: A few records done, two answers match.
  - label: Pairwise reuse across tasks
    status: proposed
    note: Code exists, no results yet.
  - label: Workflow retrieval and adaptation
    status: proposed
  unique:
  - Framed as a hit-rate study before building the cache.
  - A closed vocabulary makes graphs from different agents countable.

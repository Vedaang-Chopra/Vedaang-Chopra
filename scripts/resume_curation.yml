- id: malware
  name: Malware detection from memory forensics
  credit: Paper with a co-author, B.Tech. Dataset and code are public.
  credit_kind: coursework
  state: Finished
  lenses:
  - research
  order:
    research: 8
    agentic: 9
  problem: Antivirus looks at files, but malware cannot hide from the memory of the machine it runs on. Can low-level
    information from a memory dump become a useful signal for machine-learning detection?
  idea: 'Build the whole pipeline end to end: run ransomware in isolated machines, capture memory, analyse it with
    Volatility 2 and a public YARA rule set, turn the findings into a labelled dataset, then study the feature space
    and compare classifiers. IEEE ICAIA 2026, accepted, presenting Nov 16.'
